<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Laboratorio Django (Lista Simple){% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 40px; color: #1a1a1a; }
        .main-container { max-width: 700px; margin: 0 auto; border: 1px solid #e0e0e0; padding: 30px; border-radius: 4px; }
        h1 { font-weight: normal; color: #1a1a1a; margin-top: 0; padding-bottom: 15px; border-bottom: 1px solid #e0e0e0; }
        .interactive-search-box { width: 100%; padding: 12px; margin-bottom: 25px; border: 2px solid #b0b0b0; border-radius: 2px; box-sizing: border-box; font-size: 15px; }
        .item-list-container { margin: 0; padding: 0; list-style: none; }
        .list-item-row { padding: 20px 0; border-bottom: 1px solid #e0e0e0; position: relative; }
        .list-item-row:last-child { border-bottom: none; }
        .list-item-title { font-weight: bold; font-size: 1.1em; color: #1a1a1a; margin: 0 0 5px 0; }
        .list-item-description { margin: 0 0 10px 0; color: #4d4d4d; line-height: 1.4; }
        .list-item-timestamp { font-size: 13px; color: #808080; }
        .list-empty-message { text-align: center; color: #666; font-style: italic; padding: 20px 0; }
    </style>
</head>
<body>
    <div class="main-container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
