{% extends 'veterinaria/base.html' %}
{% block title %}{% if servicio %}Editar servicio{% else %}Nuevo servicio{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">{% if servicio %}Editar servicio{% else %}Nuevo servicio{% endif %}</h1><form method="post">{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-2"><button class="btn btn-success" type="submit">Guardar</button><a class="btn btn-outline-secondary" href="{% url 'lista_servicios' %}">Cancelar</a></div></form></div></div></div></div>
{% endblock %}
